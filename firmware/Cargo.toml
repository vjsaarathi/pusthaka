[package]
name = "reader-os-firmware"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
reader-os = { path = "..", default-features = true }

# Hardware baseline checked on 2026-09-30.
# `esp-hal` currently publishes 1.2.2 and supports ESP32-C3.
[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { version = "1.2.2", default-features = false, features = ["esp32c3", "rt"] }
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
embassy-executor = { version = "0.10.0", features = ["platform-riscv32", "executor-thread"] }
embassy-time = "0.5.1"
