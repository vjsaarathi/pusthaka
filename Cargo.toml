[workspace]
resolver = "3"
members = [
    ".",
    "firmware",
    "tools/simulator",
]

[package]
name = "reader-os"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Portable Rust-native firmware architecture for dedicated e-readers."

[features]
# The feature names model the previously agreed capability profiles.
default = ["core", "extended", "connected"]
core = []
extended = ["core"]
connected = ["extended"]

[lib]
path = "src/lib.rs"

[dependencies]
rusttype = { version = "0.9.3", default-features = false, features = ["libm", "libm-math"] }
