[workspace]
resolver = "3"
members = [
    ".",
    "firmware/linux_desktop"
]

[package]
name = "reader-os"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Portable Rust-native firmware architecture for dedicated e-readers."

[features]
default = ["core", "extended", "connected"]
core = []
extended = ["core"]
connected = ["extended"]
ingestion = ["std", "dep:zip", "dep:quick-xml", "dep:pdf-extract"]
std = []

[lib]
path = "src/lib.rs"

[dependencies]
rusttype = { version = "0.9.3", default-features = false, features = ["libm", "libm-math"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp"] }
rkyv = { version = "0.8", default-features = false, features = ["alloc"] }
hashbrown = "0.17.1"
zip = { version = "0.6.6", optional = true }
quick-xml = { version = "0.31.0", optional = true }
pdf-extract = { version = "0.7.0", optional = true }
